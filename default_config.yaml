analyses:
 - preprocess
 - read_level_values
 - collect
 - stats
 - test
 - motif_discovery
 - interruptions
run_id: IonStats_run
tests:
 - ks
 - cvm
 - ad        # Anderson-Darling (k-sample, midrank). Tie corrected, so unlike cvm it stays
             # calibrated on the discrete data types (qs, sig_dt), and its statistic is
             # already standardised for sample size. Note scipy caps its p value, so use
             # the 'called' column (decoy threshold) rather than 'significant' for ad.
# Data arguments
control: null
treatment: null
bam_path: null
read_path: null
summary_path: null
out_path: null
ref_path: null
# The five data types of the published pipeline. AEAD_mean and AEAD_std are
# supported but are not collected by default. The uc4 model table is in
# uncalled4's own per-read z-score convention, so an AEAD difference has to be
# taken on that scale and only its result can be rescaled -- it is therefore
# only partly robust, unlike the types below, which `normalization`
# re-standardises before anything is computed from them. Add them explicitly if
# you want them.
data_types:
 - sig_mean
 - sig_std
 - sig_dt
 - qs
 - sig_shifted_dt      # k-mer mode only: dwell regrouped by the sequence at the
                       # motor protein, `shift` bases downstream of the sensor
# Collector arguments
strand: both
k: 9
ref_name: null
ref_pos: False
shift: 12
sensing_offset: 2
n_vals: 65536
n_threads: 1
uc4_table_path: "resources/dna_r10.4.1_400bps_9mer.npz"
n_bins: null
# Per-read re-normalisation of the uc/ud values.
#   iqr     (median, IQR/1.349)   DEFAULT -- robust; the central 50% cannot be
#                                 shifted by a rare deeply-blocked population
#   mad     (median, MAD/0.6745)  Tombo's choice; more robust than std but it
#                                 still responds to the tail
#   zscore / none                 keep uncalled4's own per-read z-scoring
# uncalled4 z-scores each read, so a treated read whose std is inflated by rare
# blocked events has all its other values compressed toward the read mean. That
# shows up as a level-dependent shift and is easily mistaken for a real one.
normalization: iqr
# Quantile range the iqr method uses, as a two-element list. 25/75 is the IQR
# proper; a wider range ignores more of the distribution's shape and may be
# stabler when a modification perturbs the centre. norm_params.py reports six
# candidate ranges -- measure before changing this.
norm_quantiles:
 - 25
 - 75
# Divisor applied to the robust scale. Null uses the normal-consistency constant
# for the chosen method, so all methods agree on Gaussian data. Override only to
# match an existing absolute scale.
norm_const: null
# Path to a per-read raw-signal scale table from build_raw_norm_table.py, or
# null to take the scale from the EVENT MEANS in the uc tag (the default).
# Tombo and uncalled4 normalise on the raw signal samples; this collector does
# not, and the two differ by IQR(raw)/IQR(event means) = 1.021-1.027 measured
# across five adduct samples, with no treatment dependence -- a near-constant
# 2.6%, not a bias. Set this to test the other convention end to end. Building
# the table is a separate pod5 pass per sample, because collection is arrayed
# by (sample x data type) and an inline read would repeat it per type.
norm_table: null
save_every: null
verb: True
# Tester arguments
input_type: dict
jitter: False
js: 0.01
# Seeds the jitter RNG so that two runs of the same comparison agree. The tester
# needs this key even when jitter is off, so do not delete it.
seed: 42
n_splits: 1
conversion_vals:
  sig_mean:
    - -5
    - 0.00015259021896696422
  sig_std:
    - -5
    - 0.00015259021896696422
  sig_dt:
    - 0
    - 1
  sig_shifted_dt:
    - 0
    - 1
  qs:
    - 0
    - 1
fdr_alpha : 0.05
min_run_length: 1
calibration_control: null
calibration_fdr: 0.01
peak_separation: 2
peak_merge_distance: 5
target_bases: null
# Map the treated values onto the control's current scale before testing:
# (x - treated_offset) / treated_scale. Fit mean_treated = offset + scale * mean_control
# across all k-mers; 1.0 / 0.0 means no correction. The calibration pair is always tested
# uncorrected, since two controls share a scale by construction.
treated_scale: 1.0
treated_offset: 0.0
# Stat df arguments:
quantiles: True 
# Motif discovery arguments
alphabet: "resources/custom_alphabet.txt"
control_sequence_path : null
overwrite: True
# Summary reader arguments
extract_columns:
 - 'mean_qscore_template'
 - 'sequence_length_template'
 - 'barcode_rear_score'
id_column: 'barcode_arrangement'
# Maps a sample id to the barcode used in the sequencing summary, as sample:barcode pairs,
# for when the bam files are named after the sample rather than the barcode. Samples not
# listed use their own id.
summary_ids: []
# A file of read ids for the interruptions step to use instead of filtering the summary,
# so an externally filtered subset (e.g. blocking vs passing reads) can be fed back in.
read_id_list: null
# Reads ending within `window` bases of a contig boundary have their extracted sequence
# clipped. skip_edges drops them; set it False and use_padding True to keep them padded
# with '-'. NOTE skip_edges is True here, so --skip_edges on the command line turns it OFF.
# Keep the reads that pass the filter instead of those that fail it, i.e. the fully
# sequenced read ends rather than the interrupted ones. Use this to build the control set.
invert_filter: False
skip_edges: True
use_padding: False